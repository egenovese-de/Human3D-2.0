[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "human3d"
version = "0.1.0.dev0"
requires-python = ">=3.11,<3.12"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
human3d = "human3d.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
