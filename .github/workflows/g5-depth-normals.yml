name: G5 geometric evidence controls
on:
  push:
    branches: [lab/g5-depth-normals]
    paths: ['.github/workflows/g5-depth-normals.yml', 'tools/g5/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - run: python -m pip install numpy==1.26.4 scipy==1.15.3 opencv-python-headless==4.11.0.86 Pillow==13.0.0 onnxruntime==1.24.1 psutil==7.2.2
      - run: python -m unittest discover -s tools/g5 -p test_evidence.py -v
      - run: python tools/g5/ci_depth.py g5-ci/depth.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g5-depth-${{ matrix.os }}
          path: g5-ci/depth.json
          if-no-files-found: error
  normal-windows-cpu:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: baegwangbin/DSINE
          ref: ef0c2afa32b4dd19cb8ca4567c652802cd92591c
          path: .g5-dsine
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - run: python -m pip install numpy==1.26.4 scipy==1.15.3 opencv-python-headless==4.11.0.86 Pillow==13.0.0 psutil==7.2.2
      - run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install --no-deps geffnet==1.0.2
      - run: python tools/g5/ci_normal.py .g5-dsine g5-ci/normal.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g5-normal-windows-2022
          path: g5-ci/normal.json
          if-no-files-found: error
