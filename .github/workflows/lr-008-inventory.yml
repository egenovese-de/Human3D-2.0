name: LR008 source inventory
on:
  push:
    branches: [lab/render]
    paths:
      - .github/workflows/lr-008-inventory.yml
      - tools/lab_runtime/license_inventory.py
permissions:
  contents: read
jobs:
  inventory:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - run: python tools/lab_runtime/license_inventory.py
