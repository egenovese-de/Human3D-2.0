name: Required checks
on:
  push:
    branches: [development/m1, development/m2, development/m3, development/m4, development/m5, development/stabilization]
  pull_request:
    branches: [main, development/m1, development/m2, development/m3, development/m4, development/m5, development/stabilization]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: required-${{ github.ref }}
  cancel-in-progress: true
jobs:
  classify:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.paths.outputs.code }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          code=true
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git diff --name-only "$BASE" HEAD > changed.txt
            if [ -s changed.txt ] && ! grep -Ev '^(DOCS/.*[.]md|README[.]md)$' changed.txt; then code=false; fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
  foundation:
    needs: classify
    if: needs.classify.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libgles2 libglib2.0-0t64
      - if: runner.os == 'Linux'
        run: python -m pip install --require-hashes --no-deps -r requirements-linux.lock
      - if: runner.os == 'Windows'
        run: python -m pip install --require-hashes --no-deps -r requirements-windows.lock
      - run: python -m pip install --no-deps .
      - run: python -m pip check
      - run: python -c "import PIL, PySide6"
      - run: python -m compileall -q src tests
      - run: python -m unittest discover -s tests -v
      - run: human3d --version
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan reachable history
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while read -r commit; do
            if git grep -I -l -E -e '-----BEGIN [A-Z ]*PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{30,}|AKIA[A-Z0-9]{16}|sk-[A-Za-z0-9]{32,}' "$commit" -- .; then
              echo "Potential credential detected; review required"
              exit 1
            else
              rc=$?
              test "$rc" -eq 1
            fi
            count=$((count+1))
          done < <(git rev-list --all)
          echo "PASS: $count reachable commits screened for specified credential patterns"
  summary:
    name: Required summary
    if: always()
    needs: [classify, foundation, scan]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULT: ${{ needs.foundation.result }}
          CLASSIFY: ${{ needs.classify.result }}
          CODE: ${{ needs.classify.outputs.code }}
          SCAN: ${{ needs.scan.result }}
        run: |
          echo "Security: $SCAN" >> "$GITHUB_STEP_SUMMARY"
          echo "Empirical delivery gate: NOT_RUN" >> "$GITHUB_STEP_SUMMARY"
          test "$CLASSIFY" = success
          test "$SCAN" = success
          if [ "$CODE" = false ]; then
            echo "Foundation: NOT_APPLICABLE" >> "$GITHUB_STEP_SUMMARY"
            test "$RESULT" = skipped
          else
            echo "Foundation: $RESULT" >> "$GITHUB_STEP_SUMMARY"
            test "$RESULT" = success
          fi
