name: Required checks
on:
  push:
    branches: [development/m1]
  pull_request:
    branches: [main, development/m1]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: required-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - run: python -m pip install .
      - run: python -m compileall -q src tests
      - run: python -m unittest discover -s tests -v
      - run: human3d --version
  summary:
    name: Required summary
    if: always()
    needs: [foundation]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULT: ${{ needs.foundation.result }}
        run: |
          echo "Foundation: $RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo "Empirical delivery gate: NOT_RUN (separate evidence required)" >> "$GITHUB_STEP_SUMMARY"
          test "$RESULT" = success
