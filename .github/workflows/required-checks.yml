name: Required checks
on:
  push:
    branches: [development/m1]
  pull_request:
    branches: [main, development/m1]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: required-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  classify:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.paths.outputs.code }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          code=true
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            if git diff --name-only "$BASE" HEAD | grep -q . && ! git diff --name-only "$BASE" HEAD | grep -Ev '^(DOCS/.*\.md|README\.md)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - run: python -m pip install .
      - run: python -m compileall -q src tests
      - run: python -m unittest discover -s tests -v
      - run: human3d --version
  summary:
    name: Required summary
    if: always()
    needs: [classify, foundation]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULT: ${{ needs.foundation.result }}
          CLASSIFY: ${{ needs.classify.result }}
          CODE: ${{ needs.classify.outputs.code }}
        run: |
          echo "Foundation: $RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo "Empirical delivery gate: NOT_RUN (separate evidence required)" >> "$GITHUB_STEP_SUMMARY"
          test "$CLASSIFY" = success
          if [ "$CODE" = false ]; then
            echo "Foundation: NOT_APPLICABLE (documentation only)" >> "$GITHUB_STEP_SUMMARY"
            test "$RESULT" = skipped
          else
            test "$RESULT" = success
          fi
 | grep -q .; then code=false; fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
  foundation:
    needs: classify
    if: needs.classify.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - run: python -m pip install .
      - run: python -m compileall -q src tests
      - run: python -m unittest discover -s tests -v
      - run: human3d --version
  summary:
    name: Required summary
    if: always()
    needs: [foundation]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULT: ${{ needs.foundation.result }}
        run: |
          echo "Foundation: $RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo "Empirical delivery gate: NOT_RUN (separate evidence required)" >> "$GITHUB_STEP_SUMMARY"
          test "$RESULT" = success
