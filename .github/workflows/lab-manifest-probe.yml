name: Lab manifest checksum evidence
on:
  push:
    branches: [lab/render]
    paths: ['.github/workflows/lab-manifest-probe.yml']
permissions:
  contents: read
jobs:
  checksums:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Retrieve official checksum list
        run: |
          curl --fail --silent --show-error --location https://download.blender.org/release/Blender4.5/blender-4.5.3.sha256
          echo "Run ID: ${GITHUB_RUN_ID}"
      - name: Measure additional anatomical targets and verify model
        run: |
          python - <<'PY'
          import hashlib, json, urllib.request
          rev = "1f508f6083b2f823dab15de924b3bde72e08d77c"
          base = "https://raw.githubusercontent.com/makehumancommunity/makehuman/" + rev + "/"
          files = []
          for name in ("torso-scale-depth-decr", "torso-scale-depth-incr", "torso-scale-horiz-decr", "torso-scale-horiz-incr", "torso-vshape-decr", "torso-vshape-incr"):
              path = "makehuman/data/targets/torso/" + name + ".target"
              with urllib.request.urlopen(base + path, timeout=60) as response:
                  data = response.read()
              files.append(dict(path=path, bytes=len(data), sha256=hashlib.sha256(data).hexdigest()))
          print("ANATOMICAL_MANIFEST=" + json.dumps(files))
          url = "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task"
          with urllib.request.urlopen(url, timeout=60) as response:
              data = response.read()
          assert hashlib.sha256(data).hexdigest() == "59929e1d1ee95287735ddd833b19cf4ac46d29bc7afddbbf6753c459690d574a"
          print("MODEL_BYTES=" + str(len(data)))
          PY
