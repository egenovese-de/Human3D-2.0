name: Lab manifest checksum evidence
on:
  push:
    branches: [lab/render]
    paths: ['.github/workflows/lab-manifest-probe.yml']
permissions:
  contents: read
jobs:
  checksums:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Retrieve official checksum list
        run: |
          curl --fail --silent --show-error --location https://download.blender.org/release/Blender4.5/blender-4.5.3.sha256
          echo "Run ID: ${GITHUB_RUN_ID}"
