name: Dependency probe
on:
  push:
    branches: [development/m1]
    paths:
      - requirements-candidate.txt
      - .github/workflows/dependency-probe.yml
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - run: python -m pip install --only-binary=:all: -r requirements-candidate.txt
      - run: python -m pip check
      - run: python -c "import numpy, scipy, PIL, mediapipe; from PySide6 import QtCore; from pxr import Usd; print(Usd.GetVersion(), QtCore.qVersion())"
      - run: python -m pip freeze
      - run: python -c "import importlib.metadata as m; print([(d.metadata.get('Name'),d.metadata.get('License'),d.metadata.get('License-Expression')) for d in m.distributions()])"
