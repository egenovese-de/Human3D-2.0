name: G6 geometry capacity
on:
  push:
    branches: [lab/g6-geometry-capacity]
    paths: ['tools/g6/**', '.github/workflows/g6-geometry-capacity.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geometry-operators:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - run: python -m pip install numpy==1.26.4 scipy==1.15.3
      - run: python -m unittest discover -s tools/g6 -p test_geometry.py -v
