name: Lab experiments
on:
  push:
    branches: [lab/render]
    paths:
      - lab/experiments/request.json
      - .github/workflows/lab-experiments.yml
      - tools/lab_runtime/request.py
permissions:
  contents: read
concurrency:
  group: lab-experiments-${{ github.ref }}
  cancel-in-progress: false
jobs:
  request:
    runs-on: windows-2022
    timeout-minutes: 5
    outputs:
      source: ${{ steps.request.outputs.source }}
      config: ${{ steps.request.outputs.config }}
      groups: ${{ steps.request.outputs.groups }}
      cache_key: ${{ steps.request.outputs.cache_key }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - id: request
        run: python tools/lab_runtime/request.py
  experiment:
    needs: request
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.request.outputs.source }}
          path: .lab-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - id: cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            .lab-runtime/cache
            .lab-runtime/assets/foundation
            .lab-runtime/assets/morph02
            .lab-runtime/assets/anatomical_torso
          key: ${{ needs.request.outputs.cache_key }}
      - name: Inject cache corruption for qualification
        if: steps.cache.outputs.cache-hit == 'true'
        run: |
          $asset = Get-ChildItem .lab-runtime/assets/foundation -Recurse -File | Select-Object -First 1
          if (-not $asset) { throw "Missing cached foundation asset" }
          Add-Content -LiteralPath $asset.FullName -Value 'LR006 corruption control'
          Write-Output "CORRUPTION_INJECTED=$($asset.FullName)"
      - name: Provision and verify
        env:
          GROUPS: ${{ needs.request.outputs.groups }}
          SOURCE: ${{ needs.request.outputs.source }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          $argsList = @()
          foreach ($g in ($env:GROUPS -split ' ')) { if ($g) { $argsList += @('--group',$g) } }
          python tools/lab_runtime/bootstrap.py @argsList
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/lab_runtime/verify.py --source .lab-source --source-revision $env:SOURCE @argsList
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output "CACHE_HIT=$env:CACHE_HIT"
          if ($env:CACHE_HIT -eq 'true') {
            $report = Get-Content .lab-runtime/bootstrap_report.json -Raw | ConvertFrom-Json
            $reused = @($report.assets | Where-Object { $_.state -eq 'reused' }).Count
            $repaired = @($report.assets | Where-Object { $_.group -eq 'foundation' -and $_.state -eq 'downloaded' }).Count
            if ($report.archive -ne 'reused' -or $repaired -ne 1 -or $reused -ne 372) { throw "Cache qualification mismatch" }
            Write-Output "CACHE_REPAIR_PASS reused=$reused repaired=$repaired"
          }
      - name: Execute admitted experiment
        env:
          CONFIG: ${{ needs.request.outputs.config }}
        run: python tools/lab_runtime/runner.py --config $env:CONFIG --source .lab-source --output lab-output/experiment
      - name: Diagnostics
        if: always()
        run: |
          if (Test-Path .lab-runtime/runtime_report.json) { Get-Content .lab-runtime/runtime_report.json -Raw }
          if (Test-Path lab-output/experiment/run_manifest.json) { Get-Content lab-output/experiment/run_manifest.json -Raw }
