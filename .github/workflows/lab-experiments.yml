name: Lab experiments
on:
  push:
    branches: [lab/render]
    paths:
      - lab/experiments/request.json
      - .github/workflows/lab-experiments.yml
      - tools/lab_runtime/request.py
      - tools/lab_runtime/artifacts.py
      - lab/manifests/artifact-admission.json
permissions:
  contents: read
concurrency:
  group: lab-experiments-${{ github.ref }}
  cancel-in-progress: false
jobs:
  request:
    runs-on: windows-2022
    timeout-minutes: 5
    outputs:
      source: ${{ steps.request.outputs.source }}
      config: ${{ steps.request.outputs.config }}
      groups: ${{ steps.request.outputs.groups }}
      cache_key: ${{ steps.request.outputs.cache_key }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - id: request
        run: python tools/lab_runtime/request.py
  experiment:
    needs: request
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.request.outputs.source }}
          path: .lab-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - id: cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            .lab-runtime/assets/foundation
            .lab-runtime/assets/morph02
            .lab-runtime/assets/anatomical_torso
          key: cc0-only-v2-${{ needs.request.outputs.cache_key }}
      - name: Provision and verify
        env:
          GROUPS: ${{ needs.request.outputs.groups }}
          SOURCE: ${{ needs.request.outputs.source }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          $argsList = @()
          foreach ($g in ($env:GROUPS -split ' ')) { if ($g) { $argsList += @('--group',$g) } }
          python tools/lab_runtime/bootstrap.py @argsList
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/lab_runtime/verify.py --source .lab-source --source-revision $env:SOURCE @argsList
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output "CACHE_HIT=$env:CACHE_HIT"
      - name: Inventory installed package licenses
        run: |
          .lab-runtime/venv/Scripts/python.exe -c "import importlib.metadata as m,json; print('LICENSE_INVENTORY='+json.dumps([{'name':d.metadata['Name'],'version':d.version,'license':d.metadata.get('License-Expression') or d.metadata.get('License'),'classifiers':d.metadata.get_all('Classifier',[]),'notices':[str(f) for f in (d.files or []) if any(k in str(f).lower() for k in ('license','notice','copying'))]} for d in m.distributions()]))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute admitted experiment
        env:
          CONFIG: ${{ needs.request.outputs.config }}
        run: python tools/lab_runtime/runner.py --config $env:CONFIG --source .lab-source --output lab-output/experiment
      - name: Offline evidence replay
        if: needs.request.outputs.config == 'lab/experiments/lr-009-native.json'
        run: python tools/lab_runtime/evidence_control.py lab-output/experiment
      - name: Negative runtime controls
        if: needs.request.outputs.config == 'lab/experiments/lr-009-native.json'
        run: python tools/lab_runtime/negative_control.py
      - name: Stage admitted artifact
        if: needs.request.outputs.config == 'lab/experiments/lr-004-smoke.json' || needs.request.outputs.config == 'lab/experiments/lr-009-native.json'
        env:
          CONFIG: ${{ needs.request.outputs.config }}
        run: python tools/lab_runtime/artifacts.py --config $env:CONFIG --run lab-output/experiment --runtime .lab-runtime --output lab-output/publish
      - name: Negative artifact controls
        if: needs.request.outputs.config == 'lab/experiments/lr-004-smoke.json' || needs.request.outputs.config == 'lab/experiments/lr-009-native.json'
        run: |
          Copy-Item lab-output/publish lab-output/tampered -Recurse
          Add-Content lab-output/tampered/0/execution.log 'corruption'
          python tools/lab_runtime/artifacts.py --verify lab-output/tampered
          if ($LASTEXITCODE -eq 0) { throw "Corruption accepted" }
          Write-Output "REJECT_CORRUPTION_PASS"
          python tools/lab_runtime/artifacts.py --config lab/experiments/lr-005-q-boundaries.json --run lab-output/experiment --runtime .lab-runtime --output lab-output/denied
          if ($LASTEXITCODE -eq 0 -or (Test-Path lab-output/denied)) { throw "Unadmitted experiment accepted" }
          Write-Output "REJECT_UNADMITTED_PASS"
          python tools/lab_runtime/artifacts.py --verify lab-output/publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload admitted artifact
        if: needs.request.outputs.config == 'lab/experiments/lr-004-smoke.json' || needs.request.outputs.config == 'lab/experiments/lr-009-native.json'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lab-experiment-${{ github.run_id }}-${{ github.run_attempt }}
          path: lab-output/publish/
          retention-days: 7
          if-no-files-found: error
      - name: Native metrics
        if: needs.request.outputs.config == 'lab/experiments/lr-009-native.json'
        run: |
          Get-Content lab-output/experiment/0/metrics.json -Raw
          Get-Content lab-output/experiment/1/blender_metrics.json -Raw
      - name: Diagnostics
        if: always()
        run: |
          if (Test-Path lab-output/experiment) { Get-ChildItem lab-output/experiment -Recurse -Filter execution.log | ForEach-Object { Get-Content $_.FullName -Tail 80 } }
          if (Test-Path .lab-runtime/runtime_report.json) { Get-Content .lab-runtime/runtime_report.json -Raw }
          if (Test-Path lab-output/experiment/run_manifest.json) { Get-Content lab-output/experiment/run_manifest.json -Raw }
