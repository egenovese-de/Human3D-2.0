name: Lab runtime check
on:
  push:
    branches: [lab/render]
    paths:
      - tools/lab_runtime/verify.py
      - .github/workflows/lab-runtime-check.yml
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 480195f05fb2d1ed6c71dceabf4ba54b8bed69db
          path: .lab-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libglib2.0-0t64 libgles2
      - name: Bootstrap
        run: python tools/lab_runtime/bootstrap.py --group morph02 --group anatomical_torso
      - name: Verify runtime
        run: python tools/lab_runtime/verify.py --source .lab-source --source-revision 480195f05fb2d1ed6c71dceabf4ba54b8bed69db --group morph02 --group anatomical_torso
      - name: Publish report in logs
        if: always()
        run: python -c "from pathlib import Path; p=Path('.lab-runtime/runtime_report.json'); print(p.read_text() if p.exists() else 'No runtime report')"
