name: Lab runner check
on:
  push:
    branches: [lab/render]
    paths:
      - tools/lab_runtime/check_smoke.py
      - tools/lab_runtime/runner.py
      - tools/lab_runtime/blender_runner.py
      - tools/lab_runtime/numerical_probe.py
      - lab/experiments/lr-004-smoke.json
      - .github/workflows/lab-runner-check.yml
permissions:
  contents: read
jobs:
  runner:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 480195f05fb2d1ed6c71dceabf4ba54b8bed69db
          path: .lab-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - run: python tools/lab_runtime/bootstrap.py
      - run: python tools/lab_runtime/runner.py --config lab/experiments/lr-004-smoke.json --source .lab-source --output lab-output/run-a
      - run: python tools/lab_runtime/runner.py --config lab/experiments/lr-004-smoke.json --source .lab-source --output lab-output/run-b
      - name: Assert deterministic numerical output
        run: python -c "from pathlib import Path; import hashlib; a=Path('lab-output/run-a/0/numerical.json').read_bytes(); b=Path('lab-output/run-b/0/numerical.json').read_bytes(); assert a==b; print('D PASS',hashlib.sha256(a).hexdigest(),a.decode()); print(Path('lab-output/run-a/1/blender_metrics.json').read_text())"
      - name: Assert shared framing and PNG integrity
        run: python tools/lab_runtime/check_smoke.py
      - name: Diagnostics
        if: always()
        run: python -c "from pathlib import Path; [(print(p),print(p.read_text(errors='replace'))) for p in Path('lab-output').rglob('execution.log')]"
