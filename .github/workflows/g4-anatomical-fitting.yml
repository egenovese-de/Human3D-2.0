name: G4 anatomical fitting
on:
  push:
    branches: [lab/g4-anatomical-fitting]
    paths: ['.github/workflows/g4-anatomical-fitting.yml', 'tools/g4/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controlled-anatomy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: e0ae4eae57347466b5757bbcdaaa7194bdd31c94
          path: .g4-product
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: makehumancommunity/makehuman
          ref: 1f508f6083b2f823dab15de924b3bde72e08d77c
          path: .g4-upstream
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - name: Prepare system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libgles2 libglib2.0-0t64 libxkbcommon0
      - name: Verify permanent Lab Runtime
        run: |
          python tools/lab_runtime/bootstrap.py --group anatomical_torso --group p1_anatomy
          python tools/lab_runtime/verify.py --source .g4-product --source-revision e0ae4eae57347466b5757bbcdaaa7194bdd31c94 --group anatomical_torso --group p1_anatomy
      - name: Reproduce G4 calibrated high-mass anatomy control
        shell: bash
        run: |
          set -euo pipefail
          export U="$PWD/.g4-upstream/makehuman" OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1
          export PYTHONPATH="$PWD/.g4-product/src:$PWD/tools/g1:$PWD/tools/g2:$PWD/tools/g3:$PWD/tools/g4:$U:$U/lib:$U/apps:$U/core:$U/shared"
          PY=.lab-runtime/venv/bin/python
          BLENDER=.lab-runtime/blender/blender
          mkdir -p g4-out
          g++ -O3 -shared -fPIC tools/g2/raster.cpp -o g4-out/raster.so
          "$PY" -m unittest discover -s tools/g4 -v
          "$PY" tools/g1/g1_benchmark.py --output g4-out/references > g4-out/g1-replay.log 2>&1
          "$BLENDER" -b -t 2 --factory-startup --python-exit-code 1 --python tools/g2/blender_evidence.py -- fixtures g4-out/references/A_high_mass.npz g4-out/rgb
          "$PY" tools/g2/photographic.py --references g4-out/references --rgb g4-out --output g4-out/g2-schema --model .lab-runtime/assets/pose_lite/pose_landmarker_lite.task --raster g4-out/raster.so --cases no_matching_case
          "$PY" tools/g4/ci_fixture.py g4-out/references/A_high_mass.npz g4-out/rgb .lab-runtime/assets/pose_lite/pose_landmarker_lite.task g4-out/raster.so g4-out/input
          "$PY" tools/g4/benchmark.py --g2 g4-out/input --references g4-out/references --config g4-out/g2-schema/measurements/config.json --raster g4-out/raster.so --output g4-out/results --cases A_high_mass 2>&1 | tee g4-out/fitting.log
          "$BLENDER" -b -t 2 --factory-startup --python-exit-code 1 --python tools/g2/surface.py -- g4-out/surface.json g4-out/results/A_high_mass/A_high_mass.npz
          "$PY" -c 'import json; x=json.load(open("g4-out/results/A_high_mass/fitting.json"))["G4_RGB"]; y=json.load(open("g4-out/surface.json"))["A_high_mass"]["G4_RGB"]; assert x["status"]=="ok" and x["calls"]<=670; assert y["symmetric_mm"]["mean"]<10'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g4-registration-controls
          path: |
            g4-out/results/**/*.json
            g4-out/fitting.log
            g4-out/surface.json
          if-no-files-found: error
          retention-days: 7
