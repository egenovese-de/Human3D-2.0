name: LR008 legacy cache cleanup
on:
  push:
    branches: [lab/render]
    paths:
      - .github/workflows/lr-008-cache-cleanup.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  cleanup:
    runs-on: windows-2022
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Delete only legacy lab branch cache keys
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $endpoint = "repos/$env:GH_REPO/actions/caches?ref=refs%2Fheads%2Flab%2Frender&per_page=100"
          $raw = gh api --paginate --slurp $endpoint
          if ($LASTEXITCODE -ne 0) { throw 'Cache listing failed' }
          $pages = $raw | ConvertFrom-Json
          $old = @($pages | ForEach-Object { $_.actions_caches } | Where-Object { $_.ref -eq 'refs/heads/lab/render' -and $_.key -match '^lab-windows-2022-x64-[0-9a-f]{64}$' })
          foreach ($cache in $old) {
            gh api --method DELETE "repos/$env:GH_REPO/actions/caches/$($cache.id)"
            if ($LASTEXITCODE -ne 0) { throw 'Cache deletion failed' }
            Write-Output "LEGACY_CACHE_DELETED $($cache.id) $($cache.key)"
          }
          $raw = gh api --paginate --slurp $endpoint
          if ($LASTEXITCODE -ne 0) { throw 'Cache verification failed' }
          $remaining = @(($raw | ConvertFrom-Json) | ForEach-Object { $_.actions_caches } | Where-Object { $_.ref -eq 'refs/heads/lab/render' -and $_.key -match '^lab-windows-2022-x64-[0-9a-f]{64}$' })
          if ($remaining.Count -ne 0) { throw 'Legacy caches remain' }
          Write-Output "LEGACY_CACHE_CLEANUP_PASS deleted=$($old.Count) remaining=0"
